<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Tasks</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --border: #e4e4de;
    --text: #1a1a1a;
    --muted: #6b6b66;
    --accent: #2b6cb0;
    --accent-hover: #24558c;
    --danger: #b02b2b;
    --live: #40a862;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .who {
    font-size: 13px;
    color: var(--muted);
  }
  .who strong {
    color: var(--text);
    font-weight: 600;
  }
  .who button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font: inherit;
    padding: 0 0 0 4px;
    text-decoration: underline;
  }
  .who button:hover { color: var(--accent-hover); }
  .add {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 8px 0;
    z-index: 5;
  }
  .add input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font: inherit;
    color: var(--text);
    min-width: 0;
  }
  .add input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  .add button {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .add button:hover:not(:disabled) { background: var(--accent-hover); }
  .add button:disabled { opacity: 0.5; cursor: not-allowed; }
  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task {
    display: flex;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    align-items: flex-start;
  }
  .task input[type=checkbox] {
    margin: 3px 0 0;
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .task .body { flex: 1; min-width: 0; }
  .task .title {
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .task.done .title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 16px;
    font-size: 14px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .completed-section {
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .completed-section summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    padding: 6px 0;
    user-select: none;
    list-style: none;
  }
  .completed-section summary::-webkit-details-marker { display: none; }
  .completed-section summary::before {
    content: "▸";
    display: inline-block;
    width: 16px;
    transition: transform 0.15s ease;
  }
  .completed-section[open] summary::before { transform: rotate(90deg); }
  .completed-section summary:hover { color: var(--text); }
  .completed-section .list { margin-top: 8px; }
  .status {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 32px;
  }
  .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c9c9c2;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status.live .dot { background: var(--live); }
  .status.error .dot { background: var(--danger); }
  @media (max-width: 480px) {
    .app { padding: 16px 12px 48px; }
    h1 { font-size: 20px; }
    .add button { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Lab Tasks</h1>
    <div class="who">
      Signed in as <strong id="who-name">…</strong>
      <button id="change-name" type="button">change</button>
    </div>
  </header>

  <form class="add" id="add-form">
    <input id="add-input" type="text" placeholder="Add a task…" maxlength="500" autocomplete="off" required>
    <button type="submit" id="add-btn">Add</button>
  </form>

  <div class="list" id="open-list"></div>
  <div class="empty" id="open-empty" hidden>No open tasks. Add one above.</div>

  <details class="completed-section" id="completed-section">
    <summary>Completed (<span id="completed-count">0</span>)</summary>
    <div class="list" id="completed-list"></div>
  </details>

  <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://hhfjjtyllxckjuvvpsrl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoZmpqdHlsbHhja2p1dnZwc3JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDkxNTYsImV4cCI6MjEwMjEyNTE1Nn0.Axq6ojk3XV9tD_3lmZ5IwT7kzz1XKZP0LHgy8IzqkSM';

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- Identity ---
  const NAME_KEY = 'lab-tasks:name';
  function getName() { return (localStorage.getItem(NAME_KEY) || '').trim(); }
  function saveName(n) {
    localStorage.setItem(NAME_KEY, n);
    document.getElementById('who-name').textContent = n;
  }
  function promptName(required) {
    let cur = getName();
    while (true) {
      const input = window.prompt(
        required ? "What's your name? (shown on tasks you add or check off)" : "Change your name to:",
        cur
      );
      if (input === null) {
        if (required && !cur) continue;
        return cur;
      }
      const trimmed = input.trim();
      if (trimmed.length >= 1 && trimmed.length <= 40) {
        saveName(trimmed);
        return trimmed;
      }
      window.alert('Please enter a name (1–40 characters).');
    }
  }

  if (!getName()) promptName(true);
  document.getElementById('who-name').textContent = getName();
  document.getElementById('change-name').addEventListener('click', () => promptName(false));

  // --- State + rendering ---
  const openList = document.getElementById('open-list');
  const openEmpty = document.getElementById('open-empty');
  const completedList = document.getElementById('completed-list');
  const completedCount = document.getElementById('completed-count');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');

  const tasks = new Map(); // id -> row

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const opts = sameDay
      ? { hour: 'numeric', minute: '2-digit' }
      : { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    return d.toLocaleString(undefined, opts);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function render() {
    const all = Array.from(tasks.values());
    const open = all.filter(t => !t.completed_at)
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const done = all.filter(t => t.completed_at)
      .sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));

    openList.innerHTML = open.map(t => `
      <div class="task" data-id="${esc(t.id)}">
        <input type="checkbox" data-action="complete" aria-label="Complete task">
        <div class="body">
          <div class="title">${esc(t.title)}</div>
          <div class="meta">added by ${esc(t.created_by)} · ${esc(fmtDate(t.created_at))}</div>
        </div>
      </div>`).join('');
    openEmpty.hidden = open.length > 0;

    completedList.innerHTML = done.map(t => `
      <div class="task done" data-id="${esc(t.id)}">
        <input type="checkbox" data-action="uncomplete" checked aria-label="Un-complete task">
        <div class="body">
          <div class="title">${esc(t.title)}</div>
          <div class="meta">completed by ${esc(t.completed_by)} · ${esc(fmtDate(t.completed_at))}</div>
        </div>
      </div>`).join('');
    completedCount.textContent = done.length;
  }

  function setStatus(kind, text) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusText.textContent = text;
  }

  // --- Actions ---
  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('add-input');
    const btn = document.getElementById('add-btn');
    const title = input.value.trim();
    if (!title) return;
    const name = getName() || promptName(true);
    btn.disabled = true;
    try {
      const { data, error } = await client.from('tasks')
        .insert({ title, created_by: name })
        .select().single();
      if (error) throw error;
      tasks.set(data.id, data);
      input.value = '';
      render();
      input.focus();
    } catch (err) {
      window.alert('Could not add task: ' + (err.message || err));
    } finally {
      btn.disabled = false;
    }
  });

  document.addEventListener('change', async (e) => {
    const cb = e.target;
    if (!(cb instanceof HTMLInputElement) || cb.type !== 'checkbox') return;
    const taskEl = cb.closest('.task');
    if (!taskEl) return;
    const id = taskEl.dataset.id;
    const action = cb.dataset.action;
    const name = getName() || promptName(true);
    cb.disabled = true;

    const patch = action === 'complete'
      ? { completed_by: name, completed_at: new Date().toISOString() }
      : { completed_by: null, completed_at: null };

    try {
      const { data, error } = await client.from('tasks')
        .update(patch).eq('id', id).select().single();
      if (error) throw error;
      tasks.set(data.id, data);
      render();
    } catch (err) {
      window.alert('Could not update task: ' + (err.message || err));
      cb.checked = !cb.checked;
      cb.disabled = false;
    }
  });

  // --- Load + sync ---
  async function loadAll() {
    const { data, error } = await client.from('tasks')
      .select('*').order('created_at', { ascending: false });
    if (error) {
      setStatus('error', 'Load error: ' + error.message);
      return;
    }
    tasks.clear();
    for (const row of (data || [])) tasks.set(row.id, row);
    render();
  }

  const channel = client.channel('tasks-changes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'tasks' },
      (payload) => {
        if (payload.eventType === 'DELETE') {
          tasks.delete(payload.old.id);
        } else if (payload.new) {
          tasks.set(payload.new.id, payload.new);
        }
        render();
      })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') setStatus('live', 'Live');
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        setStatus('error', 'Reconnecting… (polling as fallback)');
      } else {
        setStatus('', 'Connecting…');
      }
    });

  // Polling fallback every 15s in case realtime drops
  setInterval(loadAll, 15000);
  loadAll();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Tasks</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --border: #e4e4de;
    --text: #1a1a1a;
    --muted: #6b6b66;
    --accent: #2b6cb0;
    --accent-hover: #24558c;
    --accent-soft: #eaf1f8;
    --danger: #b02b2b;
    --live: #40a862;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .who {
    font-size: 13px;
    color: var(--muted);
  }
  .who strong {
    color: var(--text);
    font-weight: 600;
  }
  .who button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font: inherit;
    padding: 0 0 0 4px;
    text-decoration: underline;
  }
  .who button:hover { color: var(--accent-hover); }
  .add {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 8px 0;
    z-index: 5;
  }
  .add input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font: inherit;
    color: var(--text);
    min-width: 0;
  }
  .add input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  .add button {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .add button:hover:not(:disabled) { background: var(--accent-hover); }
  .add button:disabled { opacity: 0.5; cursor: not-allowed; }
  .week-group { margin-bottom: 18px; }
  .week-group:last-child { margin-bottom: 0; }
  .week-header {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .week-header .range {
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    font-size: 12px;
    color: var(--muted);
  }
  .week-header.current { color: var(--accent); }
  .week-group .list { display: flex; flex-direction: column; gap: 8px; }
  #completed-list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    align-items: flex-start;
  }
  .task input[type=checkbox] {
    margin: 3px 0 0;
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .task .body { flex: 1; min-width: 0; }
  .task .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }
  .task .title {
    word-wrap: break-word;
    overflow-wrap: break-word;
    min-width: 0;
    flex: 1;
  }
  .task.done .title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .day-tag {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    padding-right: 22px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%236b6b66' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 6px center;
  }
  .day-tag:hover { border-color: var(--accent); color: var(--text); }
  .day-tag.set {
    color: var(--accent);
    background-color: var(--accent-soft);
    border-color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 16px;
    font-size: 14px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .completed-section {
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .completed-section summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    padding: 6px 0;
    user-select: none;
    list-style: none;
  }
  .completed-section summary::-webkit-details-marker { display: none; }
  .completed-section summary::before {
    content: "▸";
    display: inline-block;
    width: 16px;
    transition: transform 0.15s ease;
  }
  .completed-section[open] summary::before { transform: rotate(90deg); }
  .completed-section summary:hover { color: var(--text); }
  .completed-section #completed-list { margin-top: 8px; }
  .status {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 32px;
  }
  .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c9c9c2;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status.live .dot { background: var(--live); }
  .status.error .dot { background: var(--danger); }
  @media (max-width: 480px) {
    .app { padding: 16px 12px 48px; }
    h1 { font-size: 20px; }
    .add button { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Lab Tasks</h1>
    <div class="who">
      Signed in as <strong id="who-name">…</strong>
      <button id="change-name" type="button">change</button>
    </div>
  </header>

  <form class="add" id="add-form">
    <input id="add-input" type="text" placeholder="Add a task…" maxlength="500" autocomplete="off" required>
    <button type="submit" id="add-btn">Add</button>
  </form>

  <div id="open-list"></div>
  <div class="empty" id="open-empty" hidden>No open tasks. Add one above.</div>

  <details class="completed-section" id="completed-section">
    <summary>Completed (<span id="completed-count">0</span>)</summary>
    <div id="completed-list"></div>
  </details>

  <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://hhfjjtyllxckjuvvpsrl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoZmpqdHlsbHhja2p1dnZwc3JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDkxNTYsImV4cCI6MjEwMjEyNTE1Nn0.Axq6ojk3XV9tD_3lmZ5IwT7kzz1XKZP0LHgy8IzqkSM';

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const DAY_ORDER = { Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6, Sun:7 };

  // --- Identity ---
  const NAME_KEY = 'lab-tasks:name';
  function getName() { return (localStorage.getItem(NAME_KEY) || '').trim(); }
  function saveName(n) {
    localStorage.setItem(NAME_KEY, n);
    document.getElementById('who-name').textContent = n;
  }
  function promptName(required) {
    let cur = getName();
    while (true) {
      const input = window.prompt(
        required ? "What's your name? (shown on tasks you add or check off)" : "Change your name to:",
        cur
      );
      if (input === null) {
        if (required && !cur) continue;
        return cur;
      }
      const trimmed = input.trim();
      if (trimmed.length >= 1 && trimmed.length <= 40) {
        saveName(trimmed);
        return trimmed;
      }
      window.alert('Please enter a name (1–40 characters).');
    }
  }
  if (!getName()) promptName(true);
  document.getElementById('who-name').textContent = getName();
  document.getElementById('change-name').addEventListener('click', () => promptName(false));

  // --- State + rendering ---
  const openList = document.getElementById('open-list');
  const openEmpty = document.getElementById('open-empty');
  const completedList = document.getElementById('completed-list');
  const completedCount = document.getElementById('completed-count');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const tasks = new Map();

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const opts = sameDay
      ? { hour: 'numeric', minute: '2-digit' }
      : { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    return d.toLocaleString(undefined, opts);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Monday of the week containing dateStr, at 00:00 local time.
  function weekStart(dateStr) {
    const d = new Date(dateStr);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay(); // 0=Sun, 1=Mon..6=Sat
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function currentWeekStart() { return weekStart(new Date()); }
  function fmtRange(start) {
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    const opts = { month: 'short', day: 'numeric' };
    const a = start.toLocaleDateString(undefined, opts);
    const b = end.toLocaleDateString(undefined, opts);
    return `${a} – ${b}`;
  }
  function weekLabel(start) {
    const cur = currentWeekStart();
    const diffWeeks = Math.round((cur - start) / (7 * 86400000));
    const range = fmtRange(start);
    if (diffWeeks === 0) return { title: 'This week', range, current: true };
    if (diffWeeks === 1) return { title: 'Last week', range, current: false };
    if (diffWeeks === -1) return { title: 'Next week', range, current: false };
    return { title: '', range, current: false };
  }

  function dayTagHtml(t) {
    const cls = t.day_of_week ? 'day-tag set' : 'day-tag';
    const opts = ['', ...DAYS].map(d => {
      const selected = (t.day_of_week || '') === d ? ' selected' : '';
      const label = d || 'no day';
      return `<option value="${d}"${selected}>${label}</option>`;
    }).join('');
    return `<select class="${cls}" data-day-tag aria-label="Day of week">${opts}</select>`;
  }

  function openTaskHtml(t) {
    return `
      <div class="task" data-id="${esc(t.id)}">
        <input type="checkbox" data-action="complete" aria-label="Complete task">
        <div class="body">
          <div class="title-row">
            <span class="title">${esc(t.title)}</span>
            ${dayTagHtml(t)}
          </div>
          <div class="meta">added by ${esc(t.created_by)} · ${esc(fmtDate(t.created_at))}</div>
        </div>
      </div>`;
  }

  function doneTaskHtml(t) {
    const dayNote = t.day_of_week ? ` · was ${esc(t.day_of_week)}` : '';
    return `
      <div class="task done" data-id="${esc(t.id)}">
        <input type="checkbox" data-action="uncomplete" checked aria-label="Un-complete task">
        <div class="body">
          <div class="title-row">
            <span class="title">${esc(t.title)}</span>
          </div>
          <div class="meta">completed by ${esc(t.completed_by)} · ${esc(fmtDate(t.completed_at))}${dayNote}</div>
        </div>
      </div>`;
  }

  function render() {
    const all = Array.from(tasks.values());
    const open = all.filter(t => !t.completed_at);
    const done = all.filter(t => t.completed_at)
      .sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));

    // Group open tasks by ISO week of created_at
    const groups = new Map();
    for (const t of open) {
      const start = weekStart(t.created_at);
      const key = start.toISOString().slice(0, 10);
      if (!groups.has(key)) groups.set(key, { start, tasks: [] });
      groups.get(key).tasks.push(t);
    }
    const sortedGroups = Array.from(groups.values())
      .sort((a, b) => b.start - a.start);
    for (const g of sortedGroups) {
      g.tasks.sort((a, b) => {
        const da = a.day_of_week ? DAY_ORDER[a.day_of_week] : 8;
        const db = b.day_of_week ? DAY_ORDER[b.day_of_week] : 8;
        if (da !== db) return da - db;
        return new Date(b.created_at) - new Date(a.created_at);
      });
    }

    openList.innerHTML = sortedGroups.map(g => {
      const lbl = weekLabel(g.start);
      const headerText = lbl.title
        ? `<span>${esc(lbl.title)}</span><span class="range">${esc(lbl.range)}</span>`
        : `<span class="range">${esc(lbl.range)}</span>`;
      return `
        <div class="week-group">
          <h2 class="week-header${lbl.current ? ' current' : ''}">${headerText}</h2>
          <div class="list">${g.tasks.map(openTaskHtml).join('')}</div>
        </div>`;
    }).join('');
    openEmpty.hidden = open.length > 0;

    completedList.innerHTML = done.map(doneTaskHtml).join('');
    completedCount.textContent = done.length;
  }

  function setStatus(kind, text) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusText.textContent = text;
  }

  // --- Actions ---
  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('add-input');
    const btn = document.getElementById('add-btn');
    const title = input.value.trim();
    if (!title) return;
    const name = getName() || promptName(true);
    btn.disabled = true;
    try {
      const { data, error } = await client.from('tasks')
        .insert({ title, created_by: name })
        .select().single();
      if (error) throw error;
      tasks.set(data.id, data);
      input.value = '';
      render();
      input.focus();
    } catch (err) {
      window.alert('Could not add task: ' + (err.message || err));
    } finally {
      btn.disabled = false;
    }
  });

  document.addEventListener('change', async (e) => {
    const target = e.target;
    if (!target || !target.closest) return;
    const taskEl = target.closest('.task');
    if (!taskEl) return;
    const id = taskEl.dataset.id;

    // Day-of-week picker
    if (target.matches('[data-day-tag]')) {
      const value = target.value || null;
      target.disabled = true;
      try {
        const { data, error } = await client.from('tasks')
          .update({ day_of_week: value }).eq('id', id).select().single();
        if (error) throw error;
        tasks.set(data.id, data);
        render();
      } catch (err) {
        window.alert('Could not update day: ' + (err.message || err));
        target.disabled = false;
      }
      return;
    }

    // Checkbox complete/uncomplete
    if (target instanceof HTMLInputElement && target.type === 'checkbox') {
      const cb = target;
      const action = cb.dataset.action;
      const name = getName() || promptName(true);
      cb.disabled = true;
      const patch = action === 'complete'
        ? { completed_by: name, completed_at: new Date().toISOString() }
        : { completed_by: null, completed_at: null };
      try {
        const { data, error } = await client.from('tasks')
          .update(patch).eq('id', id).select().single();
        if (error) throw error;
        tasks.set(data.id, data);
        render();
      } catch (err) {
        window.alert('Could not update task: ' + (err.message || err));
        cb.checked = !cb.checked;
        cb.disabled = false;
      }
    }
  });

  // --- Load + sync ---
  async function loadAll() {
    const { data, error } = await client.from('tasks')
      .select('*').order('created_at', { ascending: false });
    if (error) {
      setStatus('error', 'Load error: ' + error.message);
      return;
    }
    tasks.clear();
    for (const row of (data || [])) tasks.set(row.id, row);
    render();
  }

  client.channel('tasks-changes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'tasks' },
      (payload) => {
        if (payload.eventType === 'DELETE') tasks.delete(payload.old.id);
        else if (payload.new) tasks.set(payload.new.id, payload.new);
        render();
      })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') setStatus('live', 'Live');
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        setStatus('error', 'Reconnecting… (polling as fallback)');
      } else {
        setStatus('', 'Connecting…');
      }
    });

  setInterval(loadAll, 15000);
  loadAll();
})();
</script>
</body>
</html>
